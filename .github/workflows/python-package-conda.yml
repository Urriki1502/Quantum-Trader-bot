name: QT Engine CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile engine
        run: python -m compileall -q QuantumTraderBot/engine QuantumTraderBot/tests_engine_v2

      - name: Run QT Engine v2 tests
        env:
          PYTHONPATH: QuantumTraderBot
        run: python -m pytest -q QuantumTraderBot/tests_engine_v2
